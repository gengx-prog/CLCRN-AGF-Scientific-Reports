name: Experiment verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-verification:
    name: CPU verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out experiment package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install CPython 3.13.7
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.7'
          architecture: x64
          cache: pip
          cache-dependency-path: 'reviewer_tools/requirements-*.txt'

      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -r reviewer_tools/requirements-cpu.txt
          python -m pip check
          python -c "from pathlib import Path; Path('reviewer_ci').mkdir()"

      - name: Check failure-path regression guards
        run: python -m unittest discover -s reviewer_tools -p 'test_*.py' -v 2>&1 | tee reviewer_ci/guard_tests.log

      - name: Run checkpoint checks and synthetic train/save/reload demo
        run: python reviewer_tools/run_demo.py --output reviewer_ci/demo

      - name: Preserve verification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewer-verification-${{ matrix.os }}
          path: reviewer_ci/
          if-no-files-found: warn
          retention-days: 30
